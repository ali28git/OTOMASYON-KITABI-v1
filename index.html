<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otomasyon Makine Tasarımı El Kitabı</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="kenar">
    <div class="marka">
      <a href="#/" class="marka-link">
        <span class="logo">⚙</span>
        <span>
          <strong>Otomasyon Tasarımı</strong>
          <small>Endüstriyel El Kitabı</small>
        </span>
      </a>
    </div>
    <div class="arama">
      <input id="aramaKutusu" type="search" placeholder="Kitapta ara… (ör. dökme demir)" autocomplete="off">
    </div>
    <nav id="modulListe"></nav>
    <div class="kenar-alt">
      <button id="fontKucuk" title="Yazıyı küçült">A−</button>
      <button id="fontBuyuk" title="Yazıyı büyüt">A+</button>
      <button id="temaBtn" title="Tema değiştir">◐ Tema</button>
    </div>
  </aside>

  <div id="ana">
    <header id="ustBar">
      <button id="menuBtn" aria-label="Menü">☰</button>
      <div id="kirinti"></div>
    </header>
    <div id="sayfaKap">
      <main id="icerik"></main>
      <aside id="sayfaIci"></aside>
    </div>
  </div>

  <!-- Çekirdek -->
  <script src="js/kitap.js"></script>
  <script src="js/moduller.js"></script>

  <!-- İçerik dosyaları (her modül ayrı dosyalarda) -->
